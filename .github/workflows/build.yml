name: Build NekoBoxPlusPlus PC

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag, e.g. v1.0.0 (empty = artifact only)"
        required: false
        default: ""

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout app
        uses: actions/checkout@v4
        with:
          path: pc

      - name: Checkout core fork
        uses: actions/checkout@v4
        with:
          repository: onlyno999/sing-box
          ref: a6545b4d305553a8a25af2dce07464ce4634f6ac
          path: sing-box-fork

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Install Wails
        shell: pwsh
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.2

      # The tag set matters: without with_utls every node
      # whose link carries fp= fails to start, and TUN's
      # mixed stack needs with_gvisor. with_ech must NOT be
      # added (deprecated in this core, breaks the build).
      - name: Build app
        shell: pwsh
        working-directory: pc
        run: wails build -platform windows/amd64 -clean -tags "with_gvisor,with_quic,with_wireguard,with_utls"

      # Single-file portable: wintun.dll is embedded in the
      # exe and written next to it on first run, so the exe
      # alone is the whole distribution.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NekoBoxPlusPlus-PC
          path: pc/build/bin/NekoBoxPlusPlus.exe

      - name: Publish release
        if: inputs.release_tag != ''
        shell: pwsh
        working-directory: pc
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.release_tag }}" build/bin/NekoBoxPlusPlus.exe --title "NekoBox++ PC ${{ inputs.release_tag }}" --notes "绿色版：单个 exe 文件，下载双击即用，不用安装。" --repo $env:GITHUB_REPOSITORY
